services:
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  discord-bot-1:
    build:
      context: .
      dockerfile: Dockerfile.jameworld
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=127.0.0.1
      - POSTGRES_PORT=5432
    network_mode: host
    restart: unless-stopped

  discord-bot-josh-hansen:
    build:
      context: .
      dockerfile: Dockerfile.josh-hansen
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - DISCORD_TOKEN=${DISCORD_TOKEN_JOSH_HANSEN}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=127.0.0.1
      - POSTGRES_PORT=5432
    network_mode: host
    restart: unless-stopped

  discord-bot-data-boy:
    build:
      context: .
      dockerfile: Dockerfile.data-boy
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - DISCORD_TOKEN_DATA_BOY=${DISCORD_TOKEN_DATA_BOY}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-anthropic}
      - HOME=/root
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=127.0.0.1
      - POSTGRES_PORT=5432
      - POSTGRES_READONLY_USER=${POSTGRES_READONLY_USER}
      - POSTGRES_READONLY_PASSWORD=${POSTGRES_READONLY_PASSWORD}
      - PGCONN=postgresql://${POSTGRES_READONLY_USER}:${POSTGRES_READONLY_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}
      # Headless container — fail fast if OAuth refresh wants a browser instead
      # of hanging 5 min waiting for a tab that doesn't exist.
      - NO_BROWSER=true
    volumes:
      # OAuth creds for Gemini provider. Mounted RW so the provider can write
      # refreshed access tokens back to oauth_creds.json on the host.
      # Harmless when MODEL_PROVIDER=anthropic.
      - /root/.gemini:/root/.gemini
    network_mode: host
    restart: unless-stopped

  adminer:
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db

  db-backup:
    image: prodrigestivill/postgres-backup-local
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    restart: unless-stopped

  leaderboard:
    build:
      context: .
      dockerfile: Dockerfile.leaderboard
    environment:
      # Public-facing web app → connect as the read-only role (SELECT only,
      # default_transaction_read_only, 10s statement timeout). A compromise of
      # this service can't write or drop anything.
      - POSTGRES_USER=${POSTGRES_READONLY_USER}
      - POSTGRES_PASSWORD=${POSTGRES_READONLY_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - PORT=3000
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
    ports:
      # Bind localhost-only: Caddy reverse-proxies to 127.0.0.1:3000, so the
      # container never needs to be reachable on the public interface.
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: jameworld-bots_postgres_data
