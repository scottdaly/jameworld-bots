services:
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  discord-bot-1:
    build:
      context: .
      dockerfile: Dockerfile.jameworld
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      # Used to refresh the discord_channels name table for the leaderboard.
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=127.0.0.1
      - POSTGRES_PORT=5432
    network_mode: host
    restart: unless-stopped

  discord-bot-josh-hansen:
    build:
      context: .
      dockerfile: Dockerfile.josh-hansen
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - DISCORD_TOKEN=${DISCORD_TOKEN_JOSH_HANSEN}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=127.0.0.1
      - POSTGRES_PORT=5432
    network_mode: host
    restart: unless-stopped

  discord-bot-data-boy:
    # A feature build takes ~60s. Docker's default 10s stop timeout would
    # SIGKILL a job mid-run; give the drain handler room to finish first.
    # A feature job runs 3-7 minutes. Anything shorter and a rebuild just
    # SIGKILLs it after the drain gives up, which is what we were doing.
    stop_grace_period: 900s
    build:
      context: .
      dockerfile: Dockerfile.data-boy
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - DISCORD_TOKEN_DATA_BOY=${DISCORD_TOKEN_DATA_BOY}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-anthropic}
      - HOME=/root
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=127.0.0.1
      - POSTGRES_PORT=5432
      - POSTGRES_READONLY_USER=${POSTGRES_READONLY_USER}
      - POSTGRES_READONLY_PASSWORD=${POSTGRES_READONLY_PASSWORD}
      - PGCONN=postgresql://${POSTGRES_READONLY_USER}:${POSTGRES_READONLY_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}
      # Headless container — fail fast if OAuth refresh wants a browser instead
      # of hanging 5 min waiting for a tab that doesn't exist.
      - NO_BROWSER=true
      # Read-only GitHub access for Data Boy's code mode. Fine-grained PAT with
      # contents:read + metadata:read only -- the same "bound by the credential,
      # not by the toolset" model as POSTGRES_READONLY_USER above.
      - GH_TOKEN=${GH_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER:-scottdaly}
      - REPO_CACHE=/var/cache/repos
      # Toaster City feature mode. The agent pushes a branch with the
      # write-scoped deploy key, then triggers a build on the droplet via a
      # forced-command key that can only run deploy.sh.
      - TOASTER_REPO=github-push:scottdaly/toaster-city.git
      - TOASTER_DEPLOY_HOST=toaster-deploy
      - TOASTER_SITE_URL=https://city.rsdaly.com
    volumes:
      # OAuth creds for Gemini provider. Mounted RW so the provider can write
      # refreshed access tokens back to oauth_creds.json on the host.
      # Harmless when MODEL_PROVIDER=anthropic.
      - /root/.gemini:/root/.gemini
      # Only the two toaster-city keys, not all of root's .ssh -- the rest
      # of that directory holds keys to other machines.
      - /root/.ssh/toaster_push:/root/.ssh/toaster_push:ro
      - /root/.ssh/toaster_trigger:/root/.ssh/toaster_trigger:ro
      - /root/toaster-ssh/config:/root/.ssh/config:ro
      - /root/toaster-ssh/known_hosts:/root/.ssh/known_hosts:ro
      # Agent edits live here until the build commits them. On the image's
      # own filesystem they die with the container; on a volume an
      # interrupted job's work can be salvaged to a branch on restart.
      - data_boy_work:/tmp/data-boy-work
      # Cloned repos persist across questions so we don't re-clone every time.
      - repo_cache:/var/cache/repos
    network_mode: host
    restart: unless-stopped

  adminer:
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db

  db-backup:
    image: prodrigestivill/postgres-backup-local
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    restart: unless-stopped

  leaderboard:
    build:
      context: .
      dockerfile: Dockerfile.leaderboard
    environment:
      # Public-facing web app → connect as the read-only role (SELECT only,
      # default_transaction_read_only, 10s statement timeout). A compromise of
      # this service can't write or drop anything.
      - POSTGRES_USER=${POSTGRES_READONLY_USER}
      - POSTGRES_PASSWORD=${POSTGRES_READONLY_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - PORT=3000
      # No Discord token here — channel names are read from the discord_channels
      # table (kept fresh by the main bot). The public service holds no token.
    ports:
      # Bind localhost-only: Caddy reverse-proxies to 127.0.0.1:3000, so the
      # container never needs to be reachable on the public interface.
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: jameworld-bots_postgres_data
  repo_cache:
  data_boy_work:
    name: jameworld-bots_repo_cache
